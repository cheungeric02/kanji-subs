<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 240px; margin: 0; padding: 14px; color: #1c1b1f; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  input[type=range] { flex: 1; }
  small { color: #666; display: block; margin-top: 10px; }
  @media (prefers-color-scheme: dark) { body { background: #1c1b1f; color: #e6e1e5; } small { color: #aaa; } }
</style>
</head>
<body>
<h1>Kanji Subs</h1>
<label><input type="checkbox" id="enabled"> Show overlay</label>
<label><input type="checkbox" id="furigana"> Furigana</label>
<label><input type="checkbox" id="pauseOnHover"> Pause on hover</label>
<label><input type="checkbox" id="autoResume"> Resume when mouse leaves</label>
<label>Size <input type="range" id="scale" min="0.7" max="1.6" step="0.05"></label>
<small>Changes apply right away. Use Yomitan on the caption to look words up.</small>
<script src="popup.js"></script>
</body>
</html>
